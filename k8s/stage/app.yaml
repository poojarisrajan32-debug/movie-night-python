apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-night
  namespace: stage
  labels:
    app: movie-night
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie-night
  template:
    metadata:
      labels:
        app: movie-night
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        # Must finish before the app container starts: waits for Postgres, then applies
        # migrations. One psql session + an advisory lock, so two Pods starting at the same
        # time cannot run the DDL simultaneously (tested: without it ~half of the starts fail).
        - name: migrate
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -U app -d app; do
                echo "waiting for db"
                sleep 2
              done
              set --
              for f in /migrations/*.sql; do set -- "$@" -f "$f"; done
              psql -v ON_ERROR_STOP=1 "postgresql://app:app@db:5432/app" \
                -c "select pg_advisory_lock(42)" "$@"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: app
          image: dapirs2006/movie-night-python:stage
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://app:app@db:5432/app
            - name: REDIS_URL
              value: redis://redis:6379
          # Readiness only: if Postgres is down, restarting the app would not help,
          # but taking it out of the Service (no traffic) is exactly right.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: migrations
          configMap:
            name: migrations
---
apiVersion: v1
kind: Service
metadata:
  name: movie-night
  namespace: stage
spec:
  type: NodePort
  selector:
    app: movie-night
  ports:
    - port: 8080
      targetPort: 8080
