apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: prod
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
            - name: POSTGRES_DB
              value: app
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}   # survives container restarts, NOT Pod deletion (migrations rebuild the schema)
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: prod
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
